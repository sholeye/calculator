<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css" />
    <script src="calculator.js" defer></script>
  </head>
  <body>
    <div class="container">
      <input class="screen" type="text" id="screen" />
      <div class="keypads">
        <div class="keypad-row">
          <button class="btn-clear key">Clear</button>
          <button class="key">/</button>
          <button class="key">*</button>
        </div>
        <div class="keypad-row">
          <button class="key">7</button>
          <button class="key">8</button>
          <button class="key">9</button>
          <button class="key">-</button>
        </div>
        <div class="keypad-row">
          <button class="key">4</button>
          <button class="key">5</button>
          <button class="key">6</button>
          <button class="key btn-plus">+</button>
        </div>
        <div class="keypad-row keypad-row-fourth">
          <button class="key">1</button>
          <button class="key">2</button>
          <button class="key">3</button>
        </div>
        <div class="keypad-row">
          <button class="key">0</button>
          <button class="key">00</button>
          <button class="key">.</button>
          <button class="key btn-equals">=</button>
        </div>
      </div>
    </div>
  </body>
</html>
